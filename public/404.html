<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>COTARME</title>
    <script>
      // Fallback SPA para hospedagens estáticas sem rewrite (ex.: GitHub Pages).
      // Preserva a rota original e devolve para o index.html.
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('spa_redirect_path', path);
        window.location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
